name: CI

on:
  push:
    branches: [main, enterprise-ai-suite, "improve/**"]
  pull_request:
    branches: [main, enterprise-ai-suite]

# A newer run on the same branch/PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public repo: read-only token, no secrets. Tests use SQLite and test-only env vars.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Existing code has ~260 long-line / one-line-statement findings; gate on
      # everything else until those are cleaned up.
      - run: ruff check . --extend-ignore E501,E701,E702
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend venv for the e2e API server
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
