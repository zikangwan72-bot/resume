# Two migration environments share this file:
#   alembic upgrade head              -> main tables (app.db Base), version table alembic_version
#   alembic -n approval upgrade head  -> approval tables (ApprovalBase), version table alembic_version_approval
# Database URLs come from the app settings (.env / DATABASE_URL / APPROVAL_DATABASE_URL),
# so nothing secret lives here.

[alembic]
script_location = %(here)s/migrations/main
prepend_sys_path = .
path_separator = os

[approval]
script_location = %(here)s/migrations/approval
prepend_sys_path = .
path_separator = os
